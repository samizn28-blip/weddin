<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف - أريج ومحمد</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Amiri', serif;
      background-color: #1a1614;
      color: #3e322b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .invitation-container {
      width: 100%;
      max-width: 430px;
      /* خلفية كريستالية بلور بلمسات دافئة ومضيئة تتوافق مع الصورة الكريستالية */
      background: radial-gradient(circle at 10% 20%, rgba(255, 248, 235, 0.95), rgba(240, 226, 205, 0.9)), 
                  url('bg-crystal.jpg') center/cover no-repeat fixed #fdfbf7;
      min-height: 100vh;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    /* ================= أيقونة العريس والعروس مع السكرول ================= */
    .floating-couple {
      position: fixed;
      right: 20px;
      bottom: 80px;
      font-size: 38px;
      z-index: 90;
      pointer-events: none;
      transition: transform 0.15s ease-out;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }

    /* ================= المشهد الأول: حفل فتح الظرف الواقعي ================= */
    .envelope-scene {
      height: 100vh;
      background: radial-gradient(circle, #3a312a 0%, #1a1614 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1000px;
    }

    .envelope-wrapper {
      width: 320px;
      height: 480px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
    }

    /* كرت الظرف */
    .envelope-base {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background-image: url('enve.jpg');
      background-size: cover;
      background-position: center;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    /* الغطاء العلو للظرف للفتح المتحرك 3D */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background-image: url('enve.jpg');
      background-size: 320px 480px;
      background-position: top center;
      transform-origin: top center;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
      border-radius: 12px 12px 0 0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
    }

    .envelope-wrapper.open {
      transform: translateY(120px) scale(0.9);
      opacity: 0;
      transition: all 1s ease-in-out 0.4s;
    }

    .tap-hint {
      color: #e6cb9a;
      font-size: 19px;
      margin-top: 25px;
      letter-spacing: 1px;
      animation: bounce 1.6s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* ================= المشهد الثاني: الدعوة والانسجام ================= */
    .invitation-content {
      background: rgba(253, 251, 247, 0.85);
      backdrop-filter: blur(10px);
      min-height: 100vh;
    }

    .hero-header {
      padding: 60px 20px 30px;
      text-align: center;
      border-bottom: 1px solid rgba(140, 106, 45, 0.2);
    }

    .names-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 48px;
      color: #7a5c28;
      margin: 0;
      font-weight: bold;
      text-shadow: 0 2px 5px rgba(122, 92, 40, 0.15);
    }

    .hero-date {
      font-size: 21px;
      color: #555;
      margin-top: 10px;
      font-weight: bold;
    }

    .card-section {
      padding: 35px 25px;
      border-bottom: 1px solid rgba(216, 195, 165, 0.4);
    }

    .bismillah {
      font-size: 26px;
      color: #8c6a2d;
      margin-bottom: 15px;
    }

    .couple-arabic {
      font-family: 'Aref Ruqaa', serif;
      font-size: 30px;
      color: #2c2523;
      margin-bottom: 15px;
    }

    .invitation-text {
      font-size: 19px;
      line-height: 1.8;
      color: #4a403a;
    }

    /* دمج صورة المصحف والدبلتين بانسجام تام */
    .quran-container {
      position: relative;
      margin: 25px 0;
      border-radius: 16px;
      padding: 5px;
      background: linear-gradient(135deg, rgba(212,175,55,0.4), rgba(253,251,247,0.1));
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .quran-img {
      width: 100%;
      height: 290px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      filter: contrast(1.03) brightness(0.98);
    }

    .event-date-details {
      font-size: 20px;
      line-height: 1.8;
      color: #7a5c28;
      margin: 20px 0;
    }

    .hall-name span {
      font-size: 25px;
      font-weight: bold;
      color: #222;
    }

    /* العداد التنازلي */
    .section-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 32px;
      color: #8c6a2d;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 12px;
      direction: rtl;
    }

    .time-box {
      background: rgba(245, 235, 224, 0.95);
      padding: 10px 14px;
      border-radius: 10px;
      min-width: 70px;
      border: 1px solid #e3d5c3;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .time-box span {
      display: block;
      font-size: 25px;
      font-weight: bold;
      color: #7a5c28;
    }

    .time-box small {
      font-size: 13px;
      color: #666;
    }

    /* جدول المواعيد (بدون عشاء) */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .timeline-row {
      display: flex;
      align-items: center
