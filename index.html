<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف محمد وأريج</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfbfa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* المشهد الأول: الفيديو الافتتاحي بملء الشاشة */
        #scene1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-in-out;
        }

        #introVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skip-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            z-index: 10000;
        }

        /* المشهد الثاني: بطاقة الدعوة والخلفية المخصصة */
        #scene2 {
            display: none;
            width: 100%;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .card-container {
            max-width: 450px;
            width: 85%;
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(8px); 
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.6);
            margin: 20px 0;
        }

        .card-initials {
            font-size: 42px;
            font-weight: bold;
            color: #cca43b;
            margin-bottom: 15px;
        }

        h2, h3 {
            color: #2b2927;
            margin: 10px 0;
        }

        p {
            color: #57534e;
            line-height: 1.6;
        }

        .rsvp-form {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(204, 164, 59, 0.2);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd7d0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: rgba(255,255,255,0.9);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #cca43b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #b38f32;
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            color: #2e7d32;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- موسيقى خلفية هادئة تعمل طوال الوقت -->
    <audio loop id="bg-music">
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <!-- المشهد الأول: الفيديو الافتتاحي -->
    <div id="scene1">
        <button class="skip-btn" onclick="transitionToInvitation()">تخطي ↩</button>
        <video id="introVideo" playsinline autoplay muted>
            <source src="intro.mp4" type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.
        </video>
    </div>

    <!-- المشهد الثاني: تفاصيل الدعوة والخلفية الجديدة -->
    <div id="scene2">
        <div class="card-container">
            <div class="card-initials">M & A</div>
            <h2>دعوة زفاف غالية</h2>
            <p>بكل حب وباقة من الورود، يتشرف محمد وأريج بدعوتكم لمشاركتهم فرحة العمر في الليلة التي تجمع قلبينا.</p>
            <p>حضوركم ينير ليلتنا ويسعد قلوبنا.</p>

            <!-- تفاصيل الموعد والمكان الفعلي -->
            <div class="event-details" style="background: rgba(204, 164, 59, 0.04); border-radius: 10px; padding: 15px; margin: 25px 0; border: 1px dashed rgba(204, 164, 59, 0.3);">
                <div style="color: #3d3830; font-size: 15.5px; margin: 8px 0; font-weight: 600;">📅 التاريخ: [اكتب تاريخ الفرح هنا]</div>
                <div style="color: #3d3830; font-size: 15.5px; margin: 8px 0; font-weight: 600;">⏰ الوقت: في تمام الساعة الثامنة مساءً</div>
                <div style="color: #3d3830; font-size: 15.5px; margin: 8px 0; font-weight: 600;">📍 المكان: صالة الأفراح - [اكتب المدينة أو القاعة هنا]</div>
            </div>

            <!-- نموذج تأكيد الحضور المصلح وبدون حقل مرافقين -->
            <div class="rsvp-form" id="rsvp-section">
                <h3>تأكيد الحضور</h3>
                <form id="weddingForm">
                    <input type="text" id="guestName" placeholder="الاسم الكريم" required>
                    
                    <select id="attendanceStatus" required>
                        <option value="" disabled selected>هل ستشرفنا بالحضور؟</option>
                        <option value="أوافق وبكل سرور">أوافق وبكل سرور</option>
                        <option value="أعتذر لظروف خاصة">أعتذر وأتمنى لكم الفرحة</option>
                    </select>

                    <button type="submit" class="btn" id="submitBtn">إرسال التأكيد</button>
                </form>
                <div id="message"></div>
            </div>
        </div>
    </div>

<script>
    const FORMSPREE_URL = 'https://formspree.io';
    const video = document.getElementById('introVideo');

    // التحكم في الفيديو والموسيقى
    window.addEventListener('load', function() {
        video.muted = false; 
        video.play().catch(e => {
            window.addEventListener('click', () => { video.muted = false; video.play(); }, {once: true});
        });
    });

    video.addEventListener('ended', function() {
        transitionToInvitation();
    });

    function transitionToInvitation() {
        const s1 = document.getElementById('scene1');
        const s2 = document.getElementById('scene2');
        const music = document.getElementById('bg-music');

        video.pause();
        s1.style.opacity = '0';
        
        setTimeout(() => {
            s1.style.display = 'none';
            s2.style.display = 'flex';
            setTimeout(() => {
                s2.style.opacity = '1';
                try { music.play(); } catch(e) {}
            }, 50);
        }, 500);
    }

    // الحماية من تكرار الرد من نفس الجهاز
    if (localStorage.getItem('hasRSVPed')) {
        document.getElementById('rsvp-section').innerHTML = "<h3>شكراً لك! لقد تم تسجيل ردك مسبقاً بنجاح.</h3>";
    }

    document.getElementById('weddingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const msgDiv = document.getElementById('message');
        
        submitBtn.disabled = true;
        msgDiv.innerText = "جاري إرسال ردك...";

        const formData = new FormData();
        formData.append("guestName", document.getElementById('guestName').value);
        formData.append("attendanceStatus", document.getElementById('attendanceStatus').value);

        fetch(FORMSPREE_URL, {
            method: 'POST',
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                localStorage.setItem('hasRSVPed', 'true');
                document.getElementById('rsvp-section').innerHTML = "<h3>تم إرسال تأكيدك بنجاح، ننتظركم بكل حب!</h3>";
            } else {
                throw new Error('فشل الإرسال');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            msgDiv.innerText = "عذراً، حدث خطأ أثناء الإرسال. يرجى المحاولة مجدداً.";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
