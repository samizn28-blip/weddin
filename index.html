<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف - محمد وأريج</title>
  
  <!-- الخطوط العربية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة الزينة الاحتفالية المتطايرة -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f7f3eb;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* الحاوية الرئيسية */
    .invitation-container {
      width: 100%;
      max-width: 430px;
      background-color: #fcf9f2;
      min-height: 100vh;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* فاصل أرابيسك دمشقي */
    .damascus-divider {
      text-align: center;
      color: #d4af37;
      font-size: 16px;
      margin: 15px 0;
      letter-spacing: 2px;
    }

    .header-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 30px;
      color: #8c6a2d;
      text-align: center;
      margin-top: 10px;
    }

    .couple-names {
      font-family: 'Aref Ruqaa', serif;
      font-size: 34px;
      color: #8c6a2d;
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    /* المربع الذهبي مع خلفية القرآن المدمجة */
    .quran-box-custom {
      width: 100%;
      border: 1px solid #cbb28d;
      border-radius: 16px;
      padding: 35px 20px;
      margin: 20px 0;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 4px 12px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;

      background-image: linear-gradient(rgba(252, 249, 242, 0.85), rgba(244, 234, 224, 0.85)), url('quran-rings.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .quran-box-custom p {
      font-size: 22px;
      color: #5a431c;
      font-family: 'Aref Ruqaa', serif;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* تفاصيل الحفل */
    .details-card {
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 22px 18px;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid rgba(212, 175, 55, 0.25);
      text-align: center;
    }

    .details-card h3 {
      font-family: 'Reem Kufi', sans-serif;
      color: #8c6a2d;
      font-size: 20px;
      margin-bottom: 14px;
    }

    .details-item {
      margin: 10px 0;
      font-size: 16px;
      color: #444444;
      line-height: 1.6;
    }

    /* الأزرار */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      font-family: 'Tajawal', sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-gold {
      background: linear-gradient(135deg, #c59b27, #a67c1e);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(197, 155, 39, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #c59b27;
      color: #8c6a2d;
    }

    /* الخاتم المتحرك والدوار مع السكرول */
    .scrolling-ring {
      position: fixed;
      top: 20px;
      right: 15px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #d4af37;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 999;
      pointer-events: none;
      transition: transform 0.1s linear;
    }

    /* نموذج تأكيد الحضور */
    .rsvp-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .rsvp-form input, .rsvp-form select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dcd3c1;
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      background-color: #faf8f5;
    }
  </style>
</head>
<body>

  <!-- الخاتم الذي يدور وينزل مع السكرول -->
  <div id="scrollRing" class="scrolling-ring">💍</div>

  <div class="invitation-container">

    <div class="damascus-divider">❖ ─── ✤ ─── ❖</div>

    <h1 class="header-title">دعوة زفاف</h1>

    <div class="couple-names">محمد & أريج</div>

    <!-- مربع القرآن الكريم مع الخلفية المدمجة -->
    <div class="quran-box-custom">
      <p>" وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً "</p>
    </div>

    <div class="damascus-divider">❀ ──── ✤ ────
