<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف - محمد وأريج</title>
  
  <!-- خطوط عربية فاخرة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Confetti مكتبة احتفالية -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #fcf9f2;
      --card-bg: #ffffff;
      --primary-gold: #d4af37;
      --dark-gold: #8c6a2d;
      --light-gold: #f4eae0;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-color);
    }

    /* الحاوية الرئيسية للهاتف */
    .invitation-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--bg-color);
      min-height: 100vh;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow-x: hidden;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* زخرفة الفاصل الشامي */
    .damascus-divider {
      text-align: center;
      color: var(--primary-gold);
      font-size: 16px;
      margin: 15px 0;
      letter-spacing: 2px;
    }

    /* هيدر الدعوة */
    .header-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 28px;
      color: var(--dark-gold);
      text-align: center;
      margin-top: 10px;
    }

    .couple-names {
      font-family: 'Aref Ruqaa', serif;
      font-size: 32px;
      color: var(--dark-gold);
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    /* المربع الذهبي للآية القرآنية مع الخلفية المدمجة */
    .quran-box-custom {
      width: 100%;
      border: 1px solid #cbb28d;
      border-radius: 16px;
      padding: 35px 20px;
      margin: 20px 0;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 5px 15px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;

      /* دمج صورة القرآن والخواتم كخلفية شفافة */
      background-image: linear-gradient(rgba(252, 249, 242, 0.88), rgba(244, 234, 224, 0.88)), url('quran-rings.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .quran-box-custom p {
      font-size: 22px;
      color: #5a431c;
      margin: 0;
      font-family: 'Aref Ruqaa', serif;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* تفاصيل الحفل */
    .details-card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid rgba(212, 175, 55, 0.2);
      text-align: center;
    }

    .details-card h3 {
      font-family: 'Reem Kufi', sans-serif;
      color: var(--dark-gold);
      font-size: 20px;
      margin-bottom: 12px;
    }

    .details-item {
      margin: 8px 0;
      font-size: 16px;
      color: #555;
    }

    /* أزرار التفاعل */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      font-family: 'Tajawal', sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.3
