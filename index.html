<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف - أريج ومحمد</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  <!-- مكتبة تساقط الورد والقلوب -->
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Amiri', -apple-system, BlinkMacSystemFont, serif;
      background-color: #12100e;
      color: #3e322b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .invitation-container {
      width: 100%;
      max-width: 430px;
      background: radial-gradient(circle at 50% 30%, #fffdfa 0%, #f4eae0 70%, #e8d7c3 100%);
      min-height: 100vh;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    /* أيقونة الخاتم الذهبي المتحركة عند التمرير */
    .floating-couple {
      position: fixed;
      right: 20px;
      bottom: 80px;
      font-size: 38px;
      z-index: 90;
      pointer-events: none;
      transition: transform 0.15s ease-out;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }

    /* ================= المشهد الأول: بطاقة الصورة ================= */
    .image-card-scene {
      height: 100vh;
      background: radial-gradient(circle, #2c241d 0%, #12100e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .image-card-wrapper {
      width: 100%;
      max-width: 340px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border: 2px solid #dfc38c;
      cursor: pointer;
      transition: transform 0.6s ease, opacity 0.6s ease;
      position: relative;
    }

    .image-card-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .image-card-wrapper.open-anim {
      transform: scale(1.08) translateY(-40px);
      opacity: 0;
    }

    .tap-hint {
      color: #e6cb9a;
      font-size: 18px;
      margin-top: 20px;
      animation: bounce 1.6s infinite;
      text-align: center;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* ================= المشهد الثاني: صفحة الدعوة ================= */
    .invitation-content {
      background: rgba(255, 253, 250, 0.92);
      min-height: 100vh;
    }

    .hero-header {
      padding: 50px 20px 30px;
      text-align: center;
      border-bottom: 1px solid rgba(140, 106, 45, 0.2);
    }

    .names-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 46px;
      color: #7a5c28;
      margin: 0;
    }

    .hero-date {
      font-size: 20px;
      color: #555;
      margin-top: 10px;
      font-weight: bold;
    }

    .card-section {
      padding: 30px 22px;
      border-bottom: 1px solid rgba(216, 195, 165, 0.4);
    }

    .bismillah {
      font-size: 24px;
      color: #8c6a2d;
      margin-bottom: 15px;
    }

    .couple-arabic {
      font-family: 'Aref Ruqaa', serif;
      font-size: 30px;
      color: #2c2523;
      margin-bottom: 15px;
    }

    .invitation-text {
      font-size: 19px;
      line-height: 1.8;
      color: #4a403a;
    }

    /* مربع القرآن الكريم الفاخر مع الخلفية الدمشقية */
    .quran-box-custom {
      width: 100%;
      border: 1px solid #cbb28d;
      border-radius: 16px;
      padding: 35px 20px;
      margin: 25px 0;
      box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 8px 20px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background-image: linear-gradient(rgba(252, 249, 242, 0.9), rgba(244, 234, 224, 0.9)), url('quran-rings.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .quran-box-custom .icon {
      font-size: 45px;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .quran-box-custom p {
      font-size: 22px;
      color: #5a431c;
      margin: 0;
      font-family: 'Aref Ruqaa', serif;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .calendar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ffffff;
      color: #7a5c28;
      border: 1px solid #d8c3a5;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .event-date-details {
      font-size: 20px;
      line-height: 1.8;
      color: #7a5c28;
      margin: 20px 0;
    }

    .hall-name span {
      font-size: 25px;
      font-weight: bold;
      color: #222;
    }

    .section-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 30px;
      color: #8c6a2d;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 10px;
      direction: rtl;
    }

    .time-box {
      background: rgba(245, 235, 224, 0.95);
      padding: 10px;
      border-radius: 10px;
      min-width: 68px;
      border: 1px solid #e3d5c3;
    }

    .time-box span {
      display: block;
      font-size: 24px;
      font-weight: bold;
      color: #7a5c28;
    }

    .time-box small { font-size: 12px; color: #666; }

    .timeline { display: flex; flex-direction: column; gap: 20px; }

    .timeline-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .timeline-row .time {
      font-weight: bold;
      color: #8c6a2d;
      width: 90px;
      text-align: left;
      font-size: 18px;
    }

    .line-node {
      width: 12px;
      height: 12px;
      background: #d4af37;
      border-radius: 50%;
    }

    .timeline-row .event {
      width: 150px;
      text-align: right;
      font-size: 18px;
    }

    .map-btn {
      display: inline-block;
      background: #7a5c28;
      color: #fff;
      text-decoration: none;
      padding: 12px 26px;
      border-radius: 25px;
      font-size: 18px;
      margin-top: 15px;
    }

    .rsvp-form { display: flex; flex-direction: column; gap: 15px; text-align: right; }

    .input-group label { display: block; font-size: 17px;
